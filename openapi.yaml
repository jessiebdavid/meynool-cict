              schema: {$ref: '#/components/schemas/AuditLogList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: session}
  parameters:
    Limit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Offset:
      in: query
      name: offset
      schema: {type: integer, minimum: 0, default: 0}
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationError:
      description: Request validation error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    DependencyUnavailable:
      description: External provider unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - UNAUTHORIZED
              - FORBIDDEN
              - NOT_FOUND
              - CONFLICT
              - RATE_LIMITED
              - DEPENDENCY_UNAVAILABLE
              - MODEL_UNAVAILABLE
              - PROVIDER_UNAVAILABLE
              - LICENCE_RESTRICTED
              - JOB_FAILED
              - INTERNAL_ERROR
            message: {type: string}
            request_id: {type: string}
    HealthResponse:
      type: object
      required: [status, database, ollama, embedding_model, scientific_providers, version, checked_at]
      properties:
        status: {type: string}
        database: {type: string}
        ollama: {type: string}
        embedding_model: {type: string}
        scientific_providers:
          type: object
          required: [pubmed, europe_pmc]
          properties:
            pubmed: {type: string}
            europe_pmc: {type: string}
        version: {type: string}
        checked_at: {type: string, format: date-time}
    LoginRequest:
      type: object
      required: [username_or_email, password]
      properties:
        username_or_email: {type: string, minLength: 1}
        password: {type: string, writeOnly: true}
    User:
      type: object
      required: [id, username, email, display_name, role, status]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string, format: email}
        display_name: {type: string}
        role:
          type: string
          enum: [admin, researcher, reviewer]
        status:
          type: string
          enum: [active, disabled, pending]
    UserResponse:
      type: object
      properties:
        user: {$ref: '#/components/schemas/User'}
    LiterarySource:
      type: object
      required: [id, canonical_title, attribution_confidence, source_status]
      properties:
        id: {type: string, format: uuid}
        canonical_title: {type: string}
        title_ta:
          type: [string, 'null']
        title_en:
          type: [string, 'null']
        attributed_author:
          type: [string, 'null']
        attribution_confidence: {type: string}
        genre:
          type: [string, 'null']
        tradition_or_collection:
          type: [string, 'null']
        source_status: {type: string}
        editions:
          type: array
          items: {$ref: '#/components/schemas/Edition'}
          description: Edition summaries, included on source detail responses.
    SourceList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LiterarySource'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    Passage:
      type: object
      required:
      - id
      - source_edition_id
      - sequence_number
      - locator
      - original_text
      - language_code
      - transcription_method
      - status
      - created_at
      properties:
        id: {type: string, format: uuid}
        source_edition_id: {type: string, format: uuid}
        passage_code:
          type: [string, 'null']
        sequence_number: {type: integer, minimum: 1}
        locator: {type: string}
        original_text: {type: string}
        normalized_text:
          type: [string, 'null']
        language_code: {type: string}
        transcription_method: {type: string}
        transcription_confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        status: {type: string}
        text_checksum:
          type: [string, 'null']
        created_at: {type: string, format: date-time}
    PassageList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Passage'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    PublicationSearchResponse:
      type: object
      required: [query, items, limit, offset, total, provider_status]
      properties:
        query: {type: string}
        items:
          type: array
          items:
            type: object
            required: [title, metadata_source, metadata_retrieved_at, local_record]
            properties:
              id:
                type: [string, 'null']
                format: uuid
              title: {type: string}
              doi:
                type: [string, 'null']
              pmid:
                type: [string, 'null']
              pmcid:
                type: [string, 'null']
              europe_pmc_id:
                type: [string, 'null']
              year:
                type: [integer, 'null']
              journal_or_repository:
                type: [string, 'null']
              canonical_url:
                type: [string, 'null']
                format: uri
              metadata_source: {type: string}
              metadata_retrieved_at: {type: string, format: date-time}
              local_record: {type: boolean}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
        provider_status:
          type: object
          additionalProperties: {type: string}
    IngestionRequest:
      type: object
      required: [source_system, job_type, query]
      properties:
        source_system:
          type: string
          enum: [pubmed, europe_pmc]
        job_type: {type: string}
        query: {type: string, minLength: 1}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
    JobAccepted:
      type: object
      required: [job_id, status, status_url]
      properties:
        job_id: {type: string, format: uuid}
        status:
          type: string
          enum: [queued]
        status_url: {type: string}
    JobStatus:
      type: object
      required:
      - id
      - status
      - source_system
      - job_type
      - records_seen
      - records_created
      - records_updated
      - records_skipped
      - error_count
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        source_system: {type: string}
        job_type: {type: string}
        records_seen: {type: integer, minimum: 0}
        records_created: {type: integer, minimum: 0}
        records_updated: {type: integer, minimum: 0}
        records_skipped: {type: integer, minimum: 0}
        error_count: {type: integer, minimum: 0}
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        error_summary:
          type: [string, 'null']
    RetrievalRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1}
        source_ids:
          type: array
          items: {type: string, format: uuid}
        include_literary_passages: {type: boolean, default: true}
        include_scientific_publications: {type: boolean, default: true}
        top_k: {type: integer, minimum: 1, maximum: 50, default: 10}
        ranking_method:
          type: string
          enum: [rrf, lexical, vector]
          default: rrf
    RetrievalResponse:
      type: object
      required: [query, ranking_method, embedding_profile_id, warnings, results]
      properties:
        query: {type: string}
        ranking_method:
          type: string
          enum: [rrf, lexical, vector]
        embedding_profile_id:
          type: [string, 'null']
          format: uuid
        warnings:
          type: array
          items: {type: string}
        results:
          type: array
          items:
            type: object
            required: [result_type, title, excerpt, rrf_score]
            properties:
              result_type:
                type: string
                enum: [literary_passage, scientific_publication]
              source_id:
                type: [string, 'null']
                format: uuid
              edition_id:
                type: [string, 'null']
                format: uuid
              passage_id:
                type: [string, 'null']
                format: uuid
              publication_id:
                type: [string, 'null']
                format: uuid
              title: {type: string}
              excerpt: {type: string}
              source_url:
                type: [string, 'null']
                format: uri
              source_locator:
                type: [string, 'null']
              lexical_rank:
                type: [integer, 'null']
              dense_rank:
                type: [integer, 'null']
              rrf_score: {type: number}
    AnalysisRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1}
        passage_ids:
          type: array
          items: {type: string, format: uuid}
        dimensions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [1D, 2D, 3D, 4D]
          default: [1D, 2D, 3D, 4D]
        include_scientific_evidence: {type: boolean, default: true}
        generate_hypotheses: {type: boolean, default: true}
        max_hypotheses: {type: integer, minimum: 0, maximum: 10, default: 5}
    AnalysisAccepted:
      type: object
      required: [analysis_id, status, status_url]
      properties:
        analysis_id: {type: string, format: uuid}
        status:
          type: string
          enum: [queued]
        status_url: {type: string}
    AnalysisResponse:
      type: object
      description: Only results actually generated are returned; missing dimensions are not fabricated.
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        query_text: {type: string}
        dimensions:
          type: object
          properties:
            1D: {type: object, additionalProperties: true}
            2D: {type: object, additionalProperties: true}
            3D: {type: object, additionalProperties: true}
            4D: {type: object, additionalProperties: true}
        claim_ids:
          type: array
          items: {type: string, format: uuid}
        hypothesis_ids:
          type: array
          items: {type: string, format: uuid}
        model:
          type: object
          properties:
            provider: {type: string}
            name: {type: string}
            version_or_digest:
              type: [string, 'null']
        prompt_version: {type: string}
        created_at: {type: string, format: date-time}
        completed_at:
          type: [string, 'null']
          format: date-time
    Claim: {type: object, description: 'Claim text, type, origin, dimension, status, uncertainty, analysis ID and
        linked source/evidence counts.', additionalProperties: true}
    ClaimEvidence:
      type: object
      description: Evidence relationship with provenance and verification/review state.
      properties:
        evidence_item_id: {type: string, format: uuid}
        evidence_type: {type: string}
        excerpt:
          type: [string, 'null']
        source_url:
          type: [string, 'null']
          format: uri
        locator:
          type: [string, 'null']
        relationship:
          type: string
          enum: [supports, contradicts, qualifies, contextualizes]
        verification_status: {type: string}
        review_status: {type: string}
    Hypothesis: {type: object, description: 'Hypothesis text, rationale, testability/novelty notes, status, limitations
        and evidence links.', additionalProperties: true}
    ReviewRequest:
      type: object
      required: [target_type, target_id, decision]
      properties:
        target_type:
          type: string
          enum: [passage, interpretation, claim, evidence_item, hypothesis, historical_procedure, instrument]
        target_id: {type: string, format: uuid}
        decision:
          type: string
          enum: [approve, revise, reject, needs_expert]
        review_notes: {type: string}
    UserCreated:
      type: object
      required: [id, username, email, display_name, role, status, must_reset_password]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string, format: email}
        display_name: {type: string}
        role:
          type: string
          enum: [admin, researcher, reviewer]
        status:
          type: string
          enum: [active, disabled, pending]
        must_reset_password: {type: boolean, const: true}
    UserCreateRequest:
      type: object
      required: [username, email, display_name, role, temporary_password]
      properties:
        username: {type: string, minLength: 1}
        email: {type: string, format: email}
        display_name: {type: string, minLength: 1}
        role:
          type: string
          enum: [admin, researcher, reviewer]
        temporary_password: {type: string, writeOnly: true}
    UserPatchRequest:
      type: object
      minProperties: 1
      properties:
        role:
          type: string
          enum: [admin, researcher, reviewer]
        status:
          type: string
          enum: [active, disabled, pending]
        display_name: {type: string, minLength: 1}
        must_reset_password: {type: boolean}
    RuntimeStatus: {type: object, description: Non-secret runtime information described in API_CONTRACT.md. Exact
        properties are returned only when actually configured and known., additionalProperties: true}
    SourceCreateRequest: {type: object, description: Source metadata fields as defined by the canonical schema;
        no illustrative source is seeded., additionalProperties: true}
    SourcePatchRequest: {type: object, minProperties: 1, description: Permitted source metadata updates. Attribution/status
        changes must be auditable., additionalProperties: true}
    Edition: {type: object, description: 'Edition metadata, provenance, identifiers, source URL, repository and
        rights status/notes.', additionalProperties: true}
    EditionCreateRequest: {type: object, description: Documented edition metadata and provenance. Fields are constrained
        by DATABASE_SCHEMA.md., additionalProperties: true}
    PassageCreateRequest:
      type: object
      required: [locator, original_text, language_code, transcription_method]
      properties:
        locator: {type: string, minLength: 1}
        original_text: {type: string, minLength: 1}
        language_code: {type: string}
        transcription_method: {type: string}
        transcription_confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
    Interpretation: {type: object, description: 'Typed translation, gloss, contextual note or interpretation. Includes
        language, author/model, review status and source reference when available.', additionalProperties: true}
    InterpretationCreateRequest: {type: object, description: Translation or interpretation fields. Model-generated
        content must include model identity/version and be unreviewed by default., additionalProperties: true}
    Revision: {type: object, description: A transcription revision record; original text is never silently overwritten.,
      additionalProperties: true}
    Publication: {type: object, description: 'Stored publication metadata, permitted abstract if available, authors,
        identifiers, canonical URL, licence/storage status and retrieval timestamps.', additionalProperties: true}
    PublicationList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Publication'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    EmbeddingJobRequest: {type: object, description: 'The contract specifies the selected approved embedding profile
        and job purpose, but does not yet define the exact request field names. Finalize these before implementing
        this request schema.', additionalProperties: true}
    EmbeddingProfileList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {type: object, description: 'Approved profile metadata, model/version/digest, dimensions, language
              coverage, evaluation summary and active status.', additionalProperties: true}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    AnalysisList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AnalysisResponse'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    ClaimEvidenceCreateRequest:
      type: object
      required: [evidence_item_id, relation, rationale, strength]
      properties:
        evidence_item_id: {type: string, format: uuid}
        relation:
          type: string
          enum: [supports, contradicts, qualifies, contextualizes]
        rationale: {type: string, minLength: 1}
        strength: {type: string, description: Evidence relationship strength; unassessed is the documented initial
            value.}
    EvidenceItem: {type: object, description: 'Evidence record with provenance, verification status, source identifiers
        and permitted excerpt.', additionalProperties: true}
    EvidenceCreateRequest: {type: object, description: 'Evidence record sourced from a real source identifier, passage,
        publication or documented other evidence.', additionalProperties: true}
    EvidenceVerifyRequest: {type: object, description: The contract requires a verification status and reviewer
        identity/time to be recorded; exact request field names need to be finalized before implementation., additionalProperties: true}
    HypothesisEvidenceRequest: {type: object, description: The contract requires an evidence relationship but does
        not yet define the complete request field schema., additionalProperties: true}
    HypothesisPatchRequest:
      type: object
      minProperties: 1
      properties:
        review_status:
          type: string
          enum: [proposed, under_review, supported, contradicted, inconclusive, withdrawn]
        review_notes:
          type: [string, 'null']
    Procedure: {type: object, description: 'Documentary description, source/evidence links, source status and safety/limitations
        note; no actionable surgical instructions.', additionalProperties: true}
    Instrument: {type: object, description: 'Historical name/description, possible modern-equivalent claim and equivalence
        status.', additionalProperties: true}
    Review: {type: object, description: Append-only review record., additionalProperties: true}
    BookmarkCreateRequest:
      type: object
      required: [target_type, target_id]
      properties:
        target_type: {type: string}
        target_id: {type: string, format: uuid}
        label:
          type: [string, 'null']
    Bookmark: {type: object, description: Bookmark owned by the authenticated user., additionalProperties: true}
    AnnotationCreateRequest:
      type: object
      required: [body, visibility]
      properties:
        passage_id:
          type: [string, 'null']
          format: uuid
        analysis_run_id:
          type: [string, 'null']
          format: uuid
        claim_id:
          type: [string, 'null']
          format: uuid
        body: {type: string, minLength: 1}
        anchor_start:
          type: [integer, 'null']
          minimum: 0
        anchor_end:
          type: [integer, 'null']
          minimum: 0
        visibility:
          type: string
          enum: [private, project]
    AnnotationPatchRequest:
      type: object
      minProperties: 1
      properties:
        body: {type: string, minLength: 1}
        anchor_start:
          type: [integer, 'null']
          minimum: 0
        anchor_end:
          type: [integer, 'null']
          minimum: 0
        visibility:
          type: string
          enum: [private, project]
    Annotation: {type: object, description: 'Annotation with owner, target and visibility metadata.', additionalProperties: true}
    DashboardMetrics:
      type: object
      required: [generated_at, counts, evaluation]
      properties:
        generated_at: {type: string, format: date-time}
        counts:
          type: object
          required: [literary_sources, passages, scientific_publications, analysis_runs, claims, evidence_items,
            hypotheses]
          properties:
            literary_sources: {type: integer, minimum: 0}
            passages: {type: integer, minimum: 0}
            scientific_publications: {type: integer, minimum: 0}
            analysis_runs: {type: integer, minimum: 0}
            claims: {type: integer, minimum: 0}
            evidence_items: {type: integer, minimum: 0}
            hypotheses: {type: integer, minimum: 0}
        evaluation:
          type: object
          required: [unsupported_claim_rate, citation_validity_rate, retrieval_recall_at_k, evaluation_set_id, evaluated_at,
            status]
          properties:
            unsupported_claim_rate:
              type: [number, 'null']
            citation_validity_rate:
              type: [number, 'null']
            retrieval_recall_at_k:
              type: [number, 'null']
            evaluation_set_id:
              type: [string, 'null']
            evaluated_at:
              type: [string, 'null']
              format: date-time
            status: {type: string}
    AuditLogList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {type: object, description: Paginated audit entry; excludes secrets and unrelated personal data.,
            additionalProperties: true}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    GenericObject: {type: object, description: The contract specifies the resource purpose but does not yet define
        a complete field-level response schema., additionalProperties: true}
    GenericObjectList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GenericObject'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    UserList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/User'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    ClaimList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Claim'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    HypothesisList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Hypothesis'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    ClaimEvidenceList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ClaimEvidence'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    ProcedureList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Procedure'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    InstrumentList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Instrument'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    ReviewList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Review'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    BookmarkList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Bookmark'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
    AnnotationList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Annotation'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: [integer, 'null']
