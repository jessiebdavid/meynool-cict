openapi: 3.1.0
info: {title: Meynool — Tamil Literary Knowledge and Scientific Evidence Intelligence Platform API, version: 0.1.0,
  description: Finalized contract baseline. Admin-created accounts only; no public registration. Implementations
    must not treat examples as real scientific data.}
servers:
- {url: 'http://127.0.0.1:8000/api/v1', description: Local development}
tags:
- {name: Health}
- {name: Auth}
- {name: Admin}
- {name: Ingestion}
- {name: Sources}
- {name: Science}
- {name: Retrieval}
- {name: Analysis}
- {name: Evidence}
- {name: Research}
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API and dependency health
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
      operationId: getHealth
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in to local researcher account
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
      operationId: postAuthLogin
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      security:
      - cookieAuth: []
      responses:
        '204': {description: Logged out}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: postAuthLogout
      x-required-roles: [authenticated]
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getAuthMe
      x-required-roles: [authenticated]
  /sources:
    get:
      tags: [Sources]
      summary: List literary sources
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - name: q
        in: query
        required: false
        schema: {type: string}
      - name: tradition_or_collection
        in: query
        required: false
        schema: {type: string}
      - name: language_code
        in: query
        required: false
        schema: {type: string}
      - name: source_status
        in: query
        required: false
        schema: {type: string}
      - name: sort
        in: query
        required: false
        schema: {type: string}
      - &id001 {$ref: '#/components/parameters/Limit'}
      - &id002 {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Source list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getSources
      security:
      - cookieAuth: []
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
    post:
      tags: [Sources]
      summary: Create literary source metadata
      operationId: postSources
      security:
      - cookieAuth: []
      description: 'Authorization: admin, authorized curator.'
      x-required-roles: [admin, authorized curator]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceCreateRequest'}
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LiterarySource'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sources/{source_id}:
    get:
      tags: [Sources]
      summary: Get literary source
      parameters:
      - in: path
        name: source_id
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LiterarySource'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getSourcesSourceId
      security:
      - cookieAuth: []
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
    patch:
      tags: [Sources]
      summary: Update literary source metadata
      operationId: patchSourcesSourceId
      description: 'Attribution confidence/status changes must be auditable.


        Authorization: admin, authorized curator.'
      parameters:
      - name: source_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      security:
      - cookieAuth: []
      x-required-roles: [admin, authorized curator]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourcePatchRequest'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LiterarySource'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /passages:
    get:
      tags: [Sources]
      summary: Search passages
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - name: q
        in: query
        required: false
        schema: {type: string}
      - name: source_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: edition_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: status
        in: query
        required: false
        schema: {type: string}
      - name: language_code
        in: query
        required: false
        schema: {type: string}
      - *id001
      - *id002
      responses:
        '200':
          description: Passage list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PassageList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getPassages
      security:
      - cookieAuth: []
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
  /passages/{passage_id}:
    get:
      tags: [Sources]
      summary: Get passage and provenance
      parameters:
      - in: path
        name: passage_id
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Passage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Passage'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getPassagesPassageId
      security:
      - cookieAuth: []
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
  /science/search:
    get:
      tags: [Science]
      summary: Search scientific literature
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - name: q
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: provider
        in: query
        required: false
        schema:
          type: string
          enum: [pubmed, europe_pmc, all]
          default: all
      - name: year_from
        in: query
        required: false
        schema: {type: integer}
      - name: year_to
        in: query
        required: false
        schema: {type: integer}
      - *id001
      - *id002
      responses:
        '200':
          description: Scientific search results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationSearchResponse'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getScienceSearch
      security:
      - cookieAuth: []
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
  /ingestion/jobs/{job_id}:
    get:
      tags: [Science]
      summary: Get ingestion job status
      security:
      - cookieAuth: []
      parameters:
      - in: path
        name: job_id
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Ingestion job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getIngestionJobsJobId
      x-required-roles: [admin]
      description: 'Authorization: admin-only as specified in API_CONTRACT.md.'
  /retrieval/search:
    post:
      tags: [Retrieval]
      summary: Hybrid lexical and vector retrieval
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetrievalRequest'}
      responses:
        '200':
          description: Ranked retrieval results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetrievalResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: postRetrievalSearch
      x-required-roles: [researcher]
  /analysis:
    post:
      tags: [Analysis]
      summary: Queue a 1D–4D analysis
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalysisRequest'}
      responses:
        '202':
          description: Analysis queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: postAnalysis
      x-required-roles: [researcher]
    get:
      tags: [Analysis]
      summary: List analyses visible to the caller
      operationId: getAnalysis
      parameters:
      - name: status
        in: query
        required: false
        schema: {type: string}
      - name: created_after
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: created_before
        in: query
        required: false
        schema: {type: string, format: date-time}
      - *id001
      - *id002
      security:
      - cookieAuth: []
      description: 'Authorization: researcher.'
      x-required-roles: [researcher]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /analysis/{analysis_id}:
    get:
      tags: [Analysis]
      summary: Get analysis status and result
      security:
      - cookieAuth: []
      parameters:
      - in: path
        name: analysis_id
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getAnalysisAnalysisId
      x-required-roles: [researcher]
  /analysis/{analysis_id}/claims:
    get:
      tags: [Evidence]
      summary: List claims and evidence summaries for an analysis
      security:
      - cookieAuth: []
      parameters:
      - in: path
        name: analysis_id
        required: true
        schema: {type: string, format: uuid}
      - &id003 {$ref: '#/components/parameters/Limit'}
      - &id004 {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Claims created by the analysis, with status and linked evidence count/summaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getAnalysisAnalysisIdClaims
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
  /analysis/{analysis_id}/hypotheses:
    get:
      tags: [Research]
      summary: List hypotheses for an analysis
      security:
      - cookieAuth: []
      parameters:
      - in: path
        name: analysis_id
        required: true
        schema: {type: string, format: uuid}
      - *id003
      - *id004
      responses:
        '200':
          description: Hypotheses with rationale, status, limitations and linked evidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HypothesisList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getAnalysisAnalysisIdHypotheses
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
  /claims/{claim_id}:
    get:
      tags: [Evidence]
      summary: Get a claim
      security:
      - cookieAuth: []
      parameters:
      - in: path
        name: claim_id
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Claim
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Claim'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getClaimsClaimId
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
  /claims/{claim_id}/evidence:
    get:
      tags: [Evidence]
      summary: Get claim evidence
      security:
      - cookieAuth: []
      parameters:
      - in: path
        name: claim_id
        required: true
        schema: {type: string, format: uuid}
      - *id003
      - *id004
      responses:
        '200':
          description: Evidence relationships with source identifiers, locator, URL, verification/review status
            and permitted excerpt.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimEvidenceList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getClaimsClaimIdEvidence
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
    post:
      tags: [Evidence]
      summary: Link existing evidence to a claim
      operationId: postClaimsClaimIdEvidence
      description: 'Do not create evidence from an unverified citation string without validating provenance.


        Authorization: researcher, reviewer.'
      parameters:
      - name: claim_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      security:
      - cookieAuth: []
      x-required-roles: [researcher, reviewer]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClaimEvidenceCreateRequest'}
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimEvidence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /procedures:
    get:
      tags: [Research]
      summary: List documented historical procedures
      security:
      - cookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - name: q
        in: query
        required: false
        schema: {type: string}
      - name: source_status
        in: query
        required: false
        schema: {type: string}
      - name: modern_clinical_status
        in: query
        required: false
        schema: {type: string}
      - *id003
      - *id004
      responses:
        '200':
          description: Procedure list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcedureList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getProcedures
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
  /instruments:
    get:
      tags: [Research]
      summary: List documented historical instruments
      security:
      - cookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - name: q
        in: query
        required: false
        schema: {type: string}
      - name: equivalence_status
        in: query
        required: false
        schema: {type: string}
      - *id003
      - *id004
      responses:
        '200':
          description: Instrument list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstrumentList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      operationId: getInstruments
      x-required-roles: [researcher, reviewer]
      description: Reviewers may read material needed for authorized review.
  /reviews:
    post:
      tags: [Research]
      summary: Submit a review for one supported target
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewRequest'}
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  decision: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
      operationId: postReviews
      x-required-roles: [reviewer, admin]
    get:
      tags: [Research]
      summary: List reviews visible to the caller
      operationId: getReviews
      parameters:
      - name: target_type
        in: query
        required: false
        schema: {type: string}
      - name: target_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: reviewer_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: decision
        in: query
        required: false
        schema: {type: string}
      - *id001
      - *id002
      security:
      - cookieAuth: []
      description: 'Authorization: reviewer, admin.


        Researchers may view only reviews permitted by project policy.'
      x-required-roles: [reviewer, admin, researcher]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dashboard/metrics:
    get:
      tags: [Research]
      summary: Get measured dashboard counts and evaluation metrics
      operationId: getDashboardMetrics
      description: 'All counts must be measured. Unrun metrics are null with status not_available.


        Authorization: researcher.


        System-wide counts may be restricted to administrators according to project privacy policy.'
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardMetrics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/users:
    post:
      tags: [Admin]
      summary: Create an account
      operationId: postAdminUsers
      description: 'The first administrator is bootstrapped by a local CLI command; no public registration endpoint
        exists.


        Authorization: admin.'
      security:
      - cookieAuth: []
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreateRequest'}
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    get:
      tags: [Admin]
      summary: List accounts
      operationId: getAdminUsers
      parameters:
      - *id001
      - *id002
      security:
      - cookieAuth: []
      description: 'Authorization: admin.'
      x-required-roles: [admin]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/users/{user_id}:
    patch:
      tags: [Admin]
      summary: Update account fields
      operationId: patchAdminUsersUserId
      description: 'Disabling an account revokes active sessions. Protect the last active administrator.


        Authorization: admin.'
      parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      security:
      - cookieAuth: []
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserPatchRequest'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/runtime:
    get:
      tags: [Admin]
      summary: Get non-secret runtime status
      operationId: getAdminRuntime
      security:
      - cookieAuth: []
      description: 'Authorization: admin.'
      x-required-roles: [admin]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /editions:
    get:
      tags: [Sources]
      summary: List editions
      operationId: getEditions
      parameters:
      - name: source_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: language_code
        in: query
        required: false
        schema: {type: string}
      - name: edition_type
        in: query
        required: false
        schema: {type: string}
      - name: rights_status
        in: query
        required: false
        schema: {type: string}
      - *id001
      - *id002
      security:
      - cookieAuth: []
      description: 'Authorization: researcher.


        Reviewers may read material needed for authorized review.'
      x-required-roles: [researcher, reviewer]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenericObjectList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /sources/{source_id}/editions:
    post:
      tags: [Sources]
      summary: Add a documented edition
      operationId: postSourcesSourceIdEditions
      parameters:
      - name: source_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      security:
      - cookieAuth: []
      description: 'Authorization: admin, authorized curator.'
      x-required-roles: [admin, authorized curator]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditionCreateRequest'}
      responses:
        '201':
          description: Resource created
          content:
            application/json:
