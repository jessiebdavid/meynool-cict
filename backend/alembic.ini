# Alembic configuration for the Meynool backend.
#
# The database URL is NOT set here. env.py reads it from app.main.Settings
# (DATABASE_URL environment variable / ../.env), so no credentials live in
# this file. Run migrations from backend/:  alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# template used to name new revision files
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
