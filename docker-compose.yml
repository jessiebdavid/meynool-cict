services:
  db:
    image: pgvector/pgvector:pg16
    container_name: meynool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meynool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - meynool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meynool"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meynool_pgdata:
